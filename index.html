<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>cell-ui demo</title>
  <style>
    html, body { margin: 0; height: 100%; font-family: "Segoe UI", "Yu Gothic", Meiryo, sans-serif; }
    body { display: flex; flex-direction: column; background: #f0f0f0; }
    header { padding: 8px 12px; display: flex; gap: 12px; align-items: center; font-size: 13px; background: #217346; color: #fff; }
    header h1 { font-size: 15px; margin: 0 8px 0 0; font-weight: 600; }
    header label { display: inline-flex; gap: 4px; align-items: center; cursor: pointer; }
    header button { font: inherit; padding: 2px 8px; }
    #app { flex: 1; min-height: 0; padding: 8px; }
    .formula-cell .cui-cell-text { color: #1f5aa6; }
  </style>
</head>
<body>
  <header>
    <h1>cell-ui</h1>
    <label><input type="checkbox" id="formulas" /> 数式プラグイン (=SUM 等) を有効化</label>
    <button id="export">JSON を書き出し</button>
    <button id="clear">クリア</button>
    <span id="hint">Excel からコピーして Ctrl+V / Excel へ Ctrl+C で貼り付けできます</span>
  </header>
  <div id="app"></div>
  <script type="module" src="/examples/demo.ts"></script>
</body>
</html>
